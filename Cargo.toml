[workspace]
resolver = "2"
members = [
    "crates/theseus-protocol",
    "crates/theseus-core",
    "crates/theseus-llm",
    "crates/theseus-tools",
    "crates/theseus-app-server",
    "crates/theseus-web",
    "crates/theseus-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.83"

[workspace.dependencies]
theseus-protocol = { path = "crates/theseus-protocol" }
theseus-core = { path = "crates/theseus-core" }
theseus-llm = { path = "crates/theseus-llm" }
theseus-tools = { path = "crates/theseus-tools" }
theseus-app-server = { path = "crates/theseus-app-server" }
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
