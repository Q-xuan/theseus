[workspace]
resolver = "2"
members = [
    "crates/pi-protocol",
    "crates/pi-core",
    "crates/pi-llm",
    "crates/pi-tools",
    "crates/pi-app-server",
    "crates/pi-web",
    "crates/pi-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.83"

[workspace.dependencies]
pi-protocol = { path = "crates/pi-protocol" }
pi-core = { path = "crates/pi-core" }
pi-llm = { path = "crates/pi-llm" }
pi-tools = { path = "crates/pi-tools" }
pi-app-server = { path = "crates/pi-app-server" }
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
