<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Theseus</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body data-app="theseus-desktop">
    <div class="frame">
      <aside class="rail" id="rail">
        <div class="rail-brand">Theseus</div>
        <button type="button" id="new-thread" class="new-chat" disabled>新对话</button>
        <div class="rail-label">最近</div>
        <nav id="sessions" class="sessions" aria-label="最近会话">
          <p id="sessions-empty" class="sessions-empty">还没有会话。</p>
        </nav>
      </aside>
      <div class="workspace">
        <header class="thread-bar">
          <button type="button" id="toggle-rail" class="ghost" aria-label="最近会话">最近</button>
          <div class="title-cluster">
            <div id="title" class="title">未打开对话</div>
            <button type="button" id="copy-thread-id" class="title-copy hidden" aria-label="复制 session id" disabled></button>
          </div>
          <div id="workspace-chip" class="workspace-chip hidden" title=""></div>
          <button type="button" id="open-prefs" class="ghost gear" aria-label="打开设置" title="设置">⚙</button>
        </header>
        <div id="prefs-mask" class="prefs-mask hidden">
          <div id="prefs" class="prefs" role="dialog" aria-label="设置" aria-modal="true">
            <div class="prefs-head">
              <div class="prefs-title">设置</div>
              <button type="button" id="close-prefs" class="ghost" aria-label="关闭设置">关闭</button>
            </div>
            <label class="prefs-field">
              <span>工作区</span>
              <div class="prefs-row">
                <input id="prefs-workspace" type="text" autocomplete="off" spellcheck="false" placeholder="目录路径" />
                <button type="button" id="prefs-pick-workspace" class="ghost">选择…</button>
              </div>
            </label>
            <p class="prefs-hint">
              壳只投影 Thread / Turn / Item，经 RPC 适配
              <a href="https://github.com/badlogic/pi-mono" target="_blank" rel="noreferrer">pi</a>。
              Windows 需要把 <code>pi</code> 放进 PATH；密钥与模型只走 pi，不写进本仓库或 <code>~/.theseus</code>。
            </p>
            <div class="prefs-actions">
              <button type="button" id="prefs-save">保存</button>
            </div>
          </div>
        </div>
        <div id="banner" class="banner hidden" role="status"></div>
        <div class="thread-col">
          <nav id="timeline" class="timeline" aria-label="回合时间线"></nav>
          <main class="thread" id="thread" data-conversation-scroll>
            <ol id="log" class="log" aria-live="polite"></ol>
          </main>
          <div id="empty" class="empty">
            <button type="button" id="empty-cta" class="empty-cta" disabled>新对话</button>
          </div>
        </div>
        <div id="dock" class="dock">
          <form id="composer" class="composer">
            <textarea
              id="input"
              rows="2"
              placeholder="发给模型… Enter 发送"
              autocomplete="off"
              disabled
            ></textarea>
            <div class="composer-strip">
              <span id="model-busy" class="model-busy" aria-hidden="true"></span>
              <div class="model-wrap">
                <button type="button" id="model-strip" class="model-strip" aria-haspopup="listbox" aria-expanded="false" aria-label="当前模型" disabled>
                  <span id="model-name" class="model-name"></span>
                  <span id="model-variant" class="model-variant"></span>
                </button>
              </div>
              <button type="button" id="stop" class="stop hidden" aria-label="停止">
                <span class="stop-sq" aria-hidden="true"></span>
              </button>
              <button type="submit" id="send" disabled>发送</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
