<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Theseus</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body data-app="theseus-desktop">
    <div class="frame">
      <aside class="rail" id="rail">
        <div class="rail-brand">Theseus</div>
        <button type="button" id="new-thread" class="new-chat" disabled>新对话</button>
        <div class="rail-label">最近</div>
        <nav id="sessions" class="sessions" aria-label="最近线程">
          <p id="sessions-empty" class="sessions-empty">还没有线程。</p>
        </nav>
      </aside>
      <div class="workspace">
        <header class="thread-bar">
          <button type="button" id="toggle-rail" class="ghost" aria-label="最近线程">最近</button>
          <div id="title" class="title">未打开对话</div>
          <div id="meta" class="meta">未连接</div>
          <div id="run-state" class="run-state hidden">进行中</div>
        </header>
        <div id="banner" class="banner hidden" role="status"></div>
        <main class="thread" id="thread" data-conversation-scroll>
          <p id="empty" class="empty">
            点左侧「新对话」开一轮，或从最近列表继续。<br />
            危险工具会在输入条上出现一张确认卡。
          </p>
          <ol id="log" class="log" aria-live="polite"></ol>
        </main>
        <div id="dock" class="dock">
          <aside id="approval" class="gate hidden" role="dialog" aria-label="工具确认">
            <div class="gate-strip"></div>
            <div class="gate-body">
              <div class="gate-kicker">需要确认才能继续</div>
              <div id="approval-tool" class="gate-tool"></div>
              <pre id="approval-summary" class="gate-summary"></pre>
              <div class="gate-actions">
                <button type="button" id="approval-reject" class="ghost">拒绝</button>
                <button type="button" id="approval-approve">批准</button>
              </div>
            </div>
          </aside>
          <form id="composer" class="composer">
            <textarea
              id="input"
              rows="2"
              placeholder="发给模型… Enter 发送"
              autocomplete="off"
              disabled
            ></textarea>
            <button type="submit" id="send" disabled>发送</button>
          </form>
        </div>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
