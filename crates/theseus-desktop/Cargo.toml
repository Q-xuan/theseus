[package]
name = "theseus-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tauri thin shell: owns the theseus-app-server stdio sidecar; Codex/dsh-density client UI"

[features]
default = []
# Needs WebKit (macOS/Windows local). Linux CI checks the sidecar/bridge without this.
gui = ["dep:tauri", "dep:tauri-build"]

[dependencies]
axum = { version = "0.7", features = ["ws"] }
theseus-core.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tauri = { version = "2.2", optional = true, default-features = true }

[build-dependencies]
tauri-build = { version = "2.2", optional = true }

[[bin]]
name = "theseus-desktop"
path = "src/main.rs"
