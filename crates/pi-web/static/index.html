<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pi</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body data-app="pi-web">
    <header class="top">
      <div class="brand">pi</div>
      <label class="recent-label">
        最近
        <select id="recent" disabled>
          <option value="">选择对话</option>
        </select>
      </label>
      <div id="meta" class="meta">未连接</div>
      <button type="button" id="new-thread" disabled>新对话</button>
    </header>
    <main>
      <div id="banner" class="banner hidden" role="status"></div>
      <aside id="approval" class="approval hidden" role="dialog" aria-label="工具确认">
        <div class="approval-head">需要确认</div>
        <div id="approval-tool" class="approval-tool"></div>
        <pre id="approval-summary" class="approval-summary"></pre>
        <div class="approval-actions">
          <button type="button" id="approval-approve">批准</button>
          <button type="button" id="approval-reject">拒绝</button>
        </div>
      </aside>
      <ol id="log" class="log" aria-live="polite"></ol>
      <p id="empty" class="empty">从最近对话继续，或点新对话。</p>
    </main>
    <form id="composer" class="composer">
      <textarea
        id="input"
        rows="2"
        placeholder="发给模型…"
        autocomplete="off"
        disabled
      ></textarea>
      <button type="submit" id="send" disabled>发送</button>
    </form>
    <script src="/app.js"></script>
  </body>
</html>
